<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="scoreboard">
        <h1>Basketball Scoreboard</h1>

        <div class="teams">
            <div class="team">
                <h2>Home</h2>
                <div id="home-score" class="score">0</div>
                <!-- Buttons for Home go here -->
                <button onclick="homeAdd1()">+ 1</button>
                <button onclick="homeAdd2()">+ 2</button>
                <button onclick="homeAdd3()">+ 3</button>
            </div>

            <div class="team">
                <h2>Guest</h2>
                <div id="guest-score" class="score">0</div>
                <!-- Buttons for Guest go here -->
                <button onclick="guestAdd1()">+ 1</button>
                <button onclick="guestAdd2()">+ 2</button>
                <button onclick="guestAdd3()">+ 3</button>
            </div>
        </div>

        <div id="leader">Leader: None</div>

        <!-- Reset button goes here -->
        <button onclick="reset()">Reset</button>
    </div>

    <!-- Your JavaScript goes here -->
    <script src="index.js"></script>
</body>
</html>
